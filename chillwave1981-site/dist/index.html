<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171916">
  <meta name="description" content="Tune out for a while. Original generative synth music, a rainy window, and a small escape back to 1981.">
  <title>Chillwave — Back to 1981</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171916'/%3E%3Cpath d='M6 20V12h4v8h4V8h4v16h4V12h4v8' fill='none' stroke='%23caa775' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./" aria-label="Chillwave home">chillwave<span>.</span></a>
      <span class="tagline">Back to 1981</span>
      <time id="clock" aria-label="Local time">00:00</time>
    </header>
    <main>
      <h1 class="sr-only">Chillwave — Back to 1981</h1>
      <section class="listening-room" aria-label="Listening room">
        <div class="scene">
          <canvas id="scene" width="640" height="360" role="img" aria-label="Pixel art of an amber-lit stereo beside a rainy window overlooking a quiet city at night"></canvas>
          <button id="motion" class="scene-button" aria-pressed="true" aria-label="Pause scene animation" title="Pause scene animation">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5v10M13 5v10"/></svg>
          </button>
        </div>
        <div class="transport">
          <button id="play" class="play" aria-label="Play music">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
          </button>
          <div class="now-playing">
            <details id="station-picker" class="station-picker">
              <summary aria-label="Choose a station">
                <span id="track-title">Night windows</span>
                <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
              </summary>
              <div class="popover station-menu">
                <h2>Station</h2>
                <button class="station selected" data-station="0" aria-pressed="true">
                  <span>Night windows<small>Soft synth · 72 BPM</small></span><span class="station-mark" aria-hidden="true">●</span>
                </button>
                <button class="station" data-station="1" aria-pressed="false">
                  <span>The last train<small>Slow motion · 66 BPM</small></span><span class="station-mark" aria-hidden="true">○</span>
                </button>
                <button class="station" data-station="2" aria-pressed="false">
                  <span>Almost morning<small>Dream drift · 60 BPM</small></span><span class="station-mark" aria-hidden="true">○</span>
                </button>
              </div>
            </details>
            <p id="play-status" role="status">Ready when you are</p>
          </div>
          <details id="mixer" class="mixer">
            <summary>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3v4m0 4v6M10 3v8m0 4v2M16 3v2m0 4v8M2 7h4v4H2zM8 11h4v4H8zM14 5h4v4h-4z"/></svg>
              <span>Sound</span>
            </summary>
            <div class="popover mix-panel">
              <h2>Sound levels</h2>
              <div class="sound-control">
                <div class="sound-label"><label for="music">Music</label><output for="music" id="music-value">65%</output></div>
                <input id="music" type="range" min="0" max="100" value="65" aria-label="Music volume">
              </div>
              <div class="sound-control">
                <div class="sound-label"><label for="rain">Rain on the window</label><output for="rain" id="rain-value">35%</output></div>
                <input id="rain" type="range" min="0" max="100" value="35" aria-label="Rain volume">
              </div>
              <div class="sound-control">
                <div class="sound-label"><label for="city">Distant city</label><output for="city" id="city-value">15%</output></div>
                <input id="city" type="range" min="0" max="100" value="15" aria-label="City volume">
              </div>
            </div>
          </details>
        </div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </div>
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
